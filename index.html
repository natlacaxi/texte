<!DOCTYPE html>
<html lang="fr" class="dark h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analyse Texte 2 - La Boétie</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        /* Anti-selection & smooth styling */
        body {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0c;
        }

        /* Custom range slider styling */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 14px;
            width: 14px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            margin-top: -4px;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            transition: transform 0.1s ease;
        }

        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            border-radius: 9999px;
        }
    </style>
</head>
<body class="text-gray-100 min-h-full flex flex-col justify-between items-center p-4 sm:p-6 selection:bg-none" oncontextmenu="return false;">

    <!-- Background Subtle Glow Effect -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-40 -left-40 w-96 h-96 bg-purple-900/20 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-blue-900/20 rounded-full blur-3xl"></div>
    </div>

    <!-- Header -->
    <header class="w-full max-w-lg flex justify-between items-center py-4 z-10">
        <div class="flex items-center gap-2 text-xs uppercase tracking-widest text-gray-400 font-semibold">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            Lecteur Audio
        </div>
        <div class="text-xs text-gray-500 font-medium border border-white/10 px-2.5 py-1 rounded-full bg-white/5">
            <i class="fa-solid fa-lock text-[10px] mr-1 text-emerald-400"></i> Streaming protégé
        </div>
    </header>

    <!-- Main Card Container -->
    <main class="w-full max-w-lg my-auto z-10">
        <div class="bg-[#121319]/90 backdrop-blur-xl border border-white/10 rounded-3xl p-6 sm:p-8 shadow-2xl shadow-black/90 flex flex-col items-center">
            
            <!-- Icon & Active Track Title Header -->
            <div class="w-full flex items-center gap-4 mb-6 pb-6 border-b border-white/10">
                <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-purple-900/50 to-blue-900/50 border border-white/15 flex items-center justify-center shrink-0 shadow-inner">
                    <i class="fa-solid fa-headphones text-2xl text-purple-300"></i>
                </div>
                <div class="overflow-hidden">
                    <span class="text-xs font-semibold text-purple-400 uppercase tracking-wider block mb-1">En cours de lecture</span>
                    <h1 id="currentTrackTitle" class="text-lg font-bold text-white truncate">
                        Analyse Texte 2 - La Boétie
                    </h1>
                </div>
            </div>

            <!-- Hidden Audio Element -->
            <audio id="audioPlayer" preload="metadata" controlsList="nodownload">
                <source id="audioSource" src="https://res.cloudinary.com/jjmksoqr/video/upload/v1793535829/JOYEUX_Anton_109_-_Analyse_lin%C3%A9aire_texte_2_-_E._Bo%C3%A9tie.mp3" type="audio/mp3">
                Votre navigateur ne prend pas en charge l'élément audio.
            </audio>

            <!-- Custom Timeline Bar -->
            <div class="w-full mb-6">
                <div class="relative flex items-center">
                    <input type="range" id="progressBar" min="0" max="100" value="0" class="w-full z-10 accent-white">
                </div>
                <div class="flex justify-between text-xs text-gray-400 mt-2 font-mono">
                    <span id="currentTime">00:00</span>
                    <span id="duration">00:00</span>
                </div>
            </div>

            <!-- Player Main Controls -->
            <div class="flex items-center justify-center gap-6 mb-8">
                <!-- Backward 10 Seconds -->
                <button id="btnRewind" title="Reculer de 10s (-10s)" class="w-12 h-12 rounded-full bg-white/5 hover:bg-white/10 border border-white/10 flex items-center justify-center text-gray-300 hover:text-white transition-all active:scale-95 focus:outline-none">
                    <i class="fa-solid fa-rotate-left text-lg"></i>
                </button>

                <!-- Play / Pause -->
                <button id="btnPlayPause" title="Lecture / Pause" class="w-16 h-16 rounded-full bg-white hover:bg-gray-200 text-black flex items-center justify-center shadow-lg shadow-white/10 transition-all transform hover:scale-105 active:scale-95 focus:outline-none">
                    <i id="playIcon" class="fa-solid fa-play text-xl ml-1"></i>
                </button>

                <!-- Forward 10 Seconds -->
                <button id="btnForward" title="Avancer de 10s (+10s)" class="w-12 h-12 rounded-full bg-white/5 hover:bg-white/10 border border-white/10 flex items-center justify-center text-gray-300 hover:text-white transition-all active:scale-95 focus:outline-none">
                    <i class="fa-solid fa-rotate-right text-lg"></i>
                </button>
            </div>

            <!-- Volume Control -->
            <div class="w-full flex items-center gap-3 px-4 py-2.5 bg-white/5 rounded-full border border-white/5 mb-8">
                <button id="btnMute" class="text-gray-400 hover:text-white focus:outline-none w-6">
                    <i id="volumeIcon" class="fa-solid fa-volume-high text-xs"></i>
                </button>
                <input type="range" id="volumeBar" min="0" max="1" step="0.05" value="1" class="w-full accent-white h-1">
            </div>

            <!-- Playlist Section -->
            <div class="w-full">
                <h2 class="text-xs uppercase font-semibold text-gray-400 tracking-wider mb-3 px-1 flex items-center gap-2">
                    <i class="fa-solid fa-list-ul"></i> Liste des enregistrements
                </h2>
                
                <div class="space-y-2" id="playlist">
                    <!-- Track 1 -->
                    <button data-index="0" class="playlist-item w-full flex items-center justify-between p-3.5 rounded-2xl bg-white/10 border border-white/15 text-left transition-all hover:bg-white/15 focus:outline-none group">
                        <div class="flex items-center gap-3 overflow-hidden">
                            <span class="track-status-icon w-8 h-8 rounded-xl bg-white/10 flex items-center justify-center text-xs font-semibold text-white group-hover:bg-white group-hover:text-black transition-colors shrink-0">
                                1
                            </span>
                            <div class="truncate">
                                <p class="text-sm font-medium text-white truncate">Analyse Texte 2 - La Boétie</p>
                                <p class="text-xs text-gray-400">Version studio</p>
                            </div>
                        </div>
                        <i class="fa-solid fa-play text-xs text-gray-400 group-hover:text-white ml-2 shrink-0"></i>
                    </button>

                    <!-- Track 2 -->
                    <button data-index="1" class="playlist-item w-full flex items-center justify-between p-3.5 rounded-2xl bg-white/5 border border-white/5 text-left transition-all hover:bg-white/10 focus:outline-none group">
                        <div class="flex items-center gap-3 overflow-hidden">
                            <span class="track-status-icon w-8 h-8 rounded-xl bg-white/10 flex items-center justify-center text-xs font-semibold text-gray-400 group-hover:bg-white group-hover:text-black transition-colors shrink-0">
                                2
                            </span>
                            <div class="truncate">
                                <p class="text-sm font-medium text-gray-300 group-hover:text-white truncate">Analyse sans cut</p>
                                <p class="text-xs text-gray-400">Version intégrale sans interruption</p>
                            </div>
                        </div>
                        <i class="fa-solid fa-play text-xs text-gray-500 group-hover:text-white ml-2 shrink-0"></i>
                    </button>
                </div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full max-w-lg text-center py-4 text-xs text-gray-500 z-10">
        &copy; Analyse Linéaire • La Boétie • Diffusion réservée
    </footer>

    <!-- Script JS -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tracks = [
                {
                    title: "Analyse Texte 2 - La Boétie",
                    src: "https://res.cloudinary.com/jjmksoqr/video/upload/v1793535829/JOYEUX_Anton_109_-_Analyse_lin%C3%A9aire_texte_2_-_E._Bo%C3%A9tie.mp3"
                },
                {
                    title: "Analyse sans cut",
                    src: "https://res.cloudinary.com/jjmksoqr/video/upload/v1793535977/Texte_2_grand.aac"
                }
            ];

            let currentTrackIndex = 0;

            const audio = document.getElementById('audioPlayer');
            const audioSource = document.getElementById('audioSource');
            const currentTrackTitle = document.getElementById('currentTrackTitle');
            const btnPlayPause = document.getElementById('btnPlayPause');
            const playIcon = document.getElementById('playIcon');
            const btnRewind = document.getElementById('btnRewind');
            const btnForward = document.getElementById('btnForward');
            const progressBar = document.getElementById('progressBar');
            const currentTimeEl = document.getElementById('currentTime');
            const durationEl = document.getElementById('duration');
            const volumeBar = document.getElementById('volumeBar');
            const btnMute = document.getElementById('btnMute');
            const volumeIcon = document.getElementById('volumeIcon');
            const playlistItems = document.querySelectorAll('.playlist-item');

            let lastVolume = 1;

            // Formater secondes en MM:SS
            function formatTime(seconds) {
                if (isNaN(seconds)) return "00:00";
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
            }

            // Charger une piste
            function loadTrack(index, autoPlay = false) {
                currentTrackIndex = index;
                audio.pause();
                audioSource.src = tracks[index].src;
                audio.load();
                currentTrackTitle.textContent = tracks[index].title;

                // Mettre à jour l'apparence de la playlist
                playlistItems.forEach((item, i) => {
                    const icon = item.querySelector('.track-status-icon');
                    const textTitle = item.querySelector('p');
                    if (i === index) {
                        item.classList.remove('bg-white/5', 'border-white/5');
                        item.classList.add('bg-white/10', 'border-white/15');
                        icon.classList.remove('text-gray-400');
                        icon.classList.add('text-white', 'bg-purple-600/50');
                        if (textTitle) textTitle.classList.add('text-white');
                    } else {
                        item.classList.remove('bg-white/10', 'border-white/15');
                        item.classList.add('bg-white/5', 'border-white/5');
                        icon.classList.remove('text-white', 'bg-purple-600/50');
                        icon.classList.add('text-gray-400');
                    }
                });

                if (autoPlay) {
                    audio.play();
                }
            }

            // Play / Pause Toggle
            function togglePlay() {
                if (audio.paused) {
                    audio.play();
                } else {
                    audio.pause();
                }
            }

            btnPlayPause.addEventListener('click', togglePlay);

            audio.addEventListener('play', () => {
                playIcon.classList.remove('fa-play', 'ml-1');
                playIcon.classList.add('fa-pause');
            });

            audio.addEventListener('pause', () => {
                playIcon.classList.remove('fa-pause');
                playIcon.classList.add('fa-play', 'ml-1');
            });

            // Boutons Avancer / Reculer 10s
            btnRewind.addEventListener('click', () => {
                audio.currentTime = Math.max(0, audio.currentTime - 10);
            });

            btnForward.addEventListener('click', () => {
                audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 10);
            });

            // Métadonnées audio chargées
            audio.addEventListener('loadedmetadata', () => {
                durationEl.textContent = formatTime(audio.duration);
            });

            // Mise à jour de la barre de progression
            audio.addEventListener('timeupdate', () => {
                if (!isNaN(audio.duration)) {
                    const progressPercent = (audio.currentTime / audio.duration) * 100;
                    progressBar.value = progressPercent;
                    currentTimeEl.textContent = formatTime(audio.currentTime);
                    
                    progressBar.style.background = `linear-gradient(to right, #ffffff ${progressPercent}%, rgba(255,255,255,0.1) ${progressPercent}%)`;
                }
            });

            // Déplacement manuel dans la piste
            progressBar.addEventListener('input', () => {
                if (!isNaN(audio.duration)) {
                    const seekTime = (progressBar.value / 100) * audio.duration;
                    audio.currentTime = seekTime;
                }
            });

            // Clic sur un item de la playlist
            playlistItems.forEach((item) => {
                item.addEventListener('click', () => {
                    const idx = parseInt(item.getAttribute('data-index'));
                    if (idx !== currentTrackIndex) {
                        loadTrack(idx, true);
                    } else {
                        togglePlay();
                    }
                });
            });

            // Gestion du volume
            volumeBar.addEventListener('input', (e) => {
                audio.volume = e.target.value;
                updateVolumeIcon(audio.volume);
            });

            btnMute.addEventListener('click', () => {
                if (audio.volume > 0) {
                    lastVolume = audio.volume;
                    audio.volume = 0;
                    volumeBar.value = 0;
                } else {
                    audio.volume = lastVolume || 1;
                    volumeBar.value = audio.volume;
                }
                updateVolumeIcon(audio.volume);
            });

            function updateVolumeIcon(vol) {
                volumeIcon.className = 'fa-solid text-xs';
                if (vol === 0) {
                    volumeIcon.classList.add('fa-volume-xmark');
                } else if (vol < 0.5) {
                    volumeIcon.classList.add('fa-volume-low');
                } else {
                    volumeIcon.classList.add('fa-volume-high');
                }
            }

            // Raccourcis Clavier (Espace = Play/Pause, Flèches = +/- 10s)
            document.addEventListener('keydown', (e) => {
                if (e.code === 'Space') {
                    e.preventDefault();
                    togglePlay();
                } else if (e.code === 'ArrowRight') {
                    audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 10);
                } else if (e.code === 'ArrowLeft') {
                    audio.currentTime = Math.max(0, audio.currentTime - 10);
                }
            });

            // --- PROTECTIONS ANTI-TÉLÉCHARGEMENT STRICTES ---
            
            // Block Clic Droit
            document.addEventListener('contextmenu', (e) => e.preventDefault(), false);

            // Block Raccourcis Enregistrement / Inspecteur
            document.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')) e.preventDefault();
                if ((e.ctrlKey || e.metaKey) && (e.key === 'u' || e.key === 'U')) e.preventDefault();
                if (e.key === 'F12') e.preventDefault();
                if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'I' || e.key === 'i')) e.preventDefault();
            });

            // Anti Drag & Drop
            document.addEventListener('dragstart', (e) => e.preventDefault());
        });
    </script>
</body>
</html>
